<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ruijie Export</title>
    <style>
      body { width: 310px; margin: 0; padding: 18px; color: #172033; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { margin: 0 0 14px; color: #596579; }
      button { display: flex; justify-content: center; width: 100%; border: 0; border-radius: 8px; padding: 10px 12px; color: white; background: #246bfd; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .75; }
      #cancel { margin-top: 8px; color: #b42318; background: #fee4e2; }
      #progress { min-height: 84px; margin-top: 12px; }
      .progress-row { display: flex; align-items: center; min-height: 28px; gap: 9px; color: #596579; }
      .progress-row.active { color: #172033; }
      .progress-row span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .spinner { width: 14px; height: 14px; box-sizing: border-box; flex: none; border: 2px dotted #246bfd; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
      .check { flex: none; color: #139653; font-size: 17px; font-weight: 700; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status { margin-top: 8px; white-space: pre-wrap; }
      .error { color: #b42318; }
      .ok { color: #087443; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Ruijie Project Export</h1>
    <p>Read-only. Downloads one local JSON snapshot.</p>
    <button id="export" type="button">Export current project</button>
    <button id="cancel" type="button" hidden>Cancel export</button>
    <div id="progress" role="status" aria-live="polite" hidden></div>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
