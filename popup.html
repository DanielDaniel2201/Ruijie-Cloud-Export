<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ruijie Export</title>
    <style>
      body { width: 330px; margin: 0; padding: 18px; color: #172033; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { margin: 0 0 14px; color: #596579; }
      button { display: flex; justify-content: center; width: 100%; border: 0; border-radius: 8px; padding: 10px 12px; color: white; background: #246bfd; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { cursor: not-allowed; opacity: .75; }
      #cancel { margin-top: 8px; color: #b42318; background: #fee4e2; }
      #preview { max-height: 280px; margin: 0 0 14px; overflow: auto; border: 1px solid #d9deea; border-radius: 8px; padding: 8px 10px; }
      #preview label { display: block; cursor: pointer; }
      #preview details { margin: 5px 0 0 8px; }
      #preview details label { margin-left: 18px; color: #596579; }
      #preview summary { cursor: pointer; font-weight: 650; }
      #preview .count { float: right; color: #7a8598; font-size: 12px; font-weight: 500; }
      #preview input { margin-right: 7px; }
      #eta { margin-top: 10px; color: #596579; font-size: 12px; }
      #progress { min-height: 84px; margin-top: 6px; }
      .progress-row { display: flex; align-items: center; min-height: 28px; gap: 9px; color: #596579; }
      .progress-row.active { color: #172033; }
      .progress-row span:first-child { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .spinner { width: 14px; height: 14px; box-sizing: border-box; flex: none; border: 2px dotted #246bfd; border-right-color: transparent; border-radius: 50%; animation: spin .8s linear infinite; }
      .check { flex: none; color: #139653; font-size: 17px; font-weight: 700; }
      @keyframes spin { to { transform: rotate(360deg); } }
      #status { margin-top: 8px; white-space: pre-wrap; }
      #mcp { margin-top: 14px; border-top: 1px solid #d9deea; padding-top: 10px; }
      #mcp summary { cursor: pointer; font-weight: 650; }
      #mcp label { display: block; margin-top: 8px; color: #596579; }
      #mcp input[type="number"], #mcp input[type="password"] { box-sizing: border-box; width: 100%; margin-top: 3px; padding: 7px; border: 1px solid #d9deea; border-radius: 6px; }
      #mcp-save { margin-top: 9px; padding: 7px; color: #246bfd; background: #eaf0ff; }
      #mcp-status { margin-top: 6px; color: #596579; font-size: 12px; }
      .error { color: #b42318; }
      .ok { color: #087443; }
      [hidden] { display: none !important; }
    </style>
  </head>
  <body>
    <h1>Ruijie Project Export</h1>
    <p>Preview and select the sections to include.</p>
    <div id="preview">
      <label><input id="select-all" type="checkbox" checked><strong>All</strong><span id="all-count" class="count"></span></label>
      <details open><summary>Project</summary>
        <label><input type="checkbox" value="project.overview" checked>Overview and network model</label>
        <label><input type="checkbox" value="topology" checked>Topology</label>
      </details>
      <details open><summary>Devices</summary>
        <label><input type="checkbox" value="devices" checked>Inventory, status and configuration</label>
      </details>
      <details open><summary>Clients</summary>
        <label><input type="checkbox" value="clients.data" checked>Client data</label>
        <label><input type="checkbox" value="clients.statistics" checked>Client statistics</label>
      </details>
      <details open><summary>Wireless</summary>
        <label><input type="checkbox" value="wireless.templates" checked>Templates and Wi-Fi</label>
        <label><input type="checkbox" value="wireless.settings" checked>Radio, load balancing and roaming</label>
      </details>
      <details open><summary>Portal authentication</summary>
        <label><input type="checkbox" value="portalAuth" checked>Policies, ability, global settings and SSIDs</label>
      </details>
      <details open><summary>Alarms</summary>
        <label><input type="checkbox" value="alarms.active" checked>Active alarms</label>
        <label><input type="checkbox" value="alarms.cleared" checked>Cleared alarms</label>
      </details>
      <details open><summary>Logs</summary>
        <label><input type="checkbox" value="operationLog" checked>Last 30 days of operation logs</label>
      </details>
    </div>
    <button id="export" type="button">Export selected sections</button>
    <button id="cancel" type="button" hidden>Cancel export</button>
    <div id="eta" role="status" aria-live="polite"></div>
    <div id="progress" role="status" aria-live="polite" hidden></div>
    <div id="status" role="status" aria-live="polite"></div>
    <details id="mcp">
      <summary>MCP agent connection</summary>
      <label><input id="mcp-enabled" type="checkbox"> Enable for the active Ruijie project</label>
      <label>Local port<input id="mcp-port" type="number" min="1" max="65535" value="32145"></label>
      <label>Pairing token<input id="mcp-token" type="password" autocomplete="off"></label>
      <button id="mcp-save" type="button">Save MCP connection</button>
      <div id="mcp-status" role="status" aria-live="polite"></div>
    </details>
    <script src="popup.js"></script>
  </body>
</html>
