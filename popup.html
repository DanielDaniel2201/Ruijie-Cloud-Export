<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Ruijie Export</title>
    <style>
      body { width: 310px; margin: 0; padding: 18px; color: #172033; font: 14px/1.45 system-ui, sans-serif; }
      h1 { margin: 0 0 6px; font-size: 18px; }
      p { margin: 0 0 14px; color: #596579; }
      button { width: 100%; border: 0; border-radius: 8px; padding: 10px 12px; color: white; background: #246bfd; font: inherit; font-weight: 650; cursor: pointer; }
      button:disabled { cursor: wait; opacity: .65; }
      #status { min-height: 42px; margin-top: 12px; white-space: pre-wrap; }
      .error { color: #b42318; }
      .ok { color: #087443; }
    </style>
  </head>
  <body>
    <h1>Ruijie Project Export</h1>
    <p>Read-only. Downloads one local JSON snapshot.</p>
    <button id="export" type="button">Export current project</button>
    <div id="status" role="status" aria-live="polite"></div>
    <script src="popup.js"></script>
  </body>
</html>
